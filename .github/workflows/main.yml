name: Kittygram CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend_tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          POSTGRES_DB: django_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U django_user -d django_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key
      DB_NAME: django_db
      DB_USER: django_user
      DB_PASSWORD: django_password
      DB_HOST: localhost
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r backend/requirements.txt ruff==0.8.0
      - run: python -m ruff check backend/
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test cats
      - name: Check infrastructure files
        run: python -m pytest
      - name: Validate Compose and workflow copy
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.production.yml config --quiet
          cmp .github/workflows/main.yml kittygram_workflow.yml

  frontend_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      PUBLIC_URL: /kittygram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build

  container_tests:
    needs: [backend_tests, frontend_tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-only-secret-key
      KITTYGRAM_URL: http://localhost:9000/kittygram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r backend/requirements.txt

      - name: Start the full application locally
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Wait for the gateway to accept HTTP requests
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error \
              --connect-timeout 3 \
              --max-time 5 \
              --output /dev/null \
              http://localhost:9000/kittygram/ 2>/dev/null; then
              echo "Gateway is ready!"
              exit 0
            fi

            echo "Waiting for gateway... ($i/30)"
            sleep 3
          done

          echo "Gateway failed to respond."
          docker compose ps -a
          docker compose logs --no-color gateway
          exit 1

      - run: python -m pytest -m integration

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up the temporary CI stack
        if: always()
        run: docker compose down -v

  build_and_push:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: container_tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: backend
            image: kittygram_backend
          - context: frontend
            image: kittygram_frontend
          - context: nginx
            image: kittygram_gateway
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}/
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

  verify_images:
    needs: build_and_push
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Verify published images can be read publicly
        run: |
          for image in kittygram_backend kittygram_frontend kittygram_gateway; do
            docker buildx imagetools inspect "$DOCKER_USERNAME/$image:$IMAGE_TAG"
          done

  notify:
    needs: verify_images
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram after all images are published
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_TO}" \
            --data-urlencode "text=Kittygram: tests passed, all three images published. ${RUN_URL}"