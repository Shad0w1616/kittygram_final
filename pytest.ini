[pytest]
python_paths = backend/
DJANGO_SETTINGS_MODULE = kittygram_backend.settings
norecursedirs = env/*
addopts = -vv -p no:cacheprovider --disable-warnings -m "not integration and not dockerhub"
testpaths = backend/tests/
python_files = test_*.py
markers =
    integration: HTTP checks against a running local Kittygram stack
    dockerhub: checks requiring published public Docker Hub images
