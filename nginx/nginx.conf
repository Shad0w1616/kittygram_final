server {
  listen 80;
  server_tokens off;
  client_max_body_size 20m;

  location = / { return 302 /kittygram/; }
  location = /kittygram { return 301 /kittygram/; }

  location ~ ^/kittygram/(api|admin)(/|$) {
    rewrite ^/kittygram/(.*)$ /$1 break;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://backend:8000;
  }

  location /kittygram/static/admin/ { alias /static/backend/admin/; }
  location /kittygram/static/rest_framework/ { alias /static/backend/rest_framework/; }
  location /kittygram/static/ { alias /static/frontend/static/; }
  location /kittygram/media/ { alias /media/; }

  location /kittygram/ {
    alias /static/frontend/;
    index index.html;
    try_files $uri $uri/ /kittygram/index.html;
  }
}
