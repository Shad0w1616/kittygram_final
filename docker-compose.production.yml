volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/kittygram_backend:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/static
      - media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/kittygram_frontend:${IMAGE_TAG:-latest}
    command: sh -c "mkdir -p /static/frontend && cp -r /app/build/. /static/frontend/"
    volumes:
      - static:/static

  gateway:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/kittygram_gateway:${IMAGE_TAG:-latest}
    ports:
      - "${GATEWAY_PORT:-9000}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    volumes:
      - static:/static:ro
      - media:/media:ro
    restart: unless-stopped
